name: Build personal APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'integrate/**']

permissions:
  contents: read

concurrency:
  group: personal-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore existing personal signing key
        shell: bash
        run: |
          echo "" | base64 -d > app/persistent-debug.keystore
          keytool -list -keystore app/persistent-debug.keystore -storepass android -alias androiddebugkey > /dev/null
      - name: Test and build FOSS and Google Cast APKs
        run: ./gradlew --console=plain :app:testFossDebugUnitTest :innertube:test :app:assembleFossDebug :app:assembleGmsDebug --warning-mode summary --no-configuration-cache
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music
          METROLIST_APP_NAME: Metrolist Nightly
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      - name: Prepare installable APKs
        run: |
          mkdir -p personal-apk
          cp app/build/outputs/apk/foss/debug/*.apk personal-apk/Metrolist.apk
          cp app/build/outputs/apk/gms/debug/*.apk personal-apk/Metrolist-with-Google-Cast.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: Metrolist-personal
          path: personal-apk/*.apk
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            innertube/build/reports/tests/

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Metrolist-personal
          path: personal-apk
      - name: Publish personal APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          TAG="v${VERSION}-personal.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" personal-apk/*.apk \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Upstream $VERSION with personal Android Auto, synced lyrics and settings changes. Signed with the existing personal debug key. Commit: $GITHUB_SHA" \
            --latest
